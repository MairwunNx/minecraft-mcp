<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden;background:#0b0d12;font-family:-apple-system,"SF Pro Display","Inter",sans-serif}
#bg{position:absolute;left:0;top:0;width:1280px;height:640px;object-fit:cover;filter:blur(1.2px) saturate(1.05)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,8,20,.84) 0%,rgba(10,8,20,.62) 38%,rgba(10,8,20,.2) 62%,rgba(10,8,20,.1) 100%)}
.text{position:absolute;left:64px;top:0;bottom:0;width:500px;display:flex;flex-direction:column;justify-content:center;color:#fff}
.text h1,.text p{text-shadow:0 2px 18px rgba(0,0,0,.45)}
.tag{display:inline-flex;align-items:center;gap:14px;font-size:18px;font-weight:700;color:#b4a6ff;letter-spacing:.06em;text-transform:uppercase;margin-bottom:18px}
.tag img{width:34px;height:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
h1{margin:0;font-size:60px;line-height:1.02;font-weight:800;letter-spacing:-.02em}
h1 span{color:#9d8cff}
p{margin:22px 0 0;font-size:22px;line-height:1.4;color:#d3d6df;max-width:470px}
.chips{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px}
.chips b{font-weight:600;font-size:16px;color:#e6e8ee;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);padding:7px 12px;border-radius:8px;backdrop-filter:blur(6px)}
.powered{margin-top:24px;display:flex;align-items:center;gap:8px;font-size:15px;color:rgba(255,255,255,.72)}
.powered strong{color:#fff;font-weight:600}
.made{position:absolute;left:64px;bottom:22px;font-size:12px;letter-spacing:.02em;color:rgba(255,255,255,.42)}
.shot{position:absolute;perspective:1600px}
.shot img{width:100%;display:block;border-radius:14px;transform:rotateY(-16deg) rotateX(4deg) rotateZ(1deg);transform-origin:left center;box-shadow:0 40px 80px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.12)}
.tag img{border-radius:8px}
.agent{position:absolute;left:660px;top:110px;width:540px;border-radius:16px;background:rgba(16,14,26,.86);border:1px solid rgba(255,255,255,.14);box-shadow:0 40px 80px rgba(0,0,0,.6);backdrop-filter:blur(14px);overflow:hidden;font:15px/1.5 -apple-system,"SF Pro Text",sans-serif;color:#e9e7f5}
.bar{display:flex;align-items:center;gap:7px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
.bar i{width:11px;height:11px;border-radius:50%;background:#3b3850}.bar i:nth-child(1){background:#ff5f57}.bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
.bar span{margin-left:10px;font:600 13px/1 "SF Mono",Menlo,monospace;color:#a7a2c4}
.msg{margin:16px 18px}
.you{margin-left:auto;width:max-content;max-width:80%;background:#5b4bd6;color:#fff;padding:10px 14px;border-radius:14px 14px 4px 14px}
.calls{margin:0 18px;display:flex;flex-direction:column;gap:6px}
.call{display:flex;align-items:center;gap:9px;font:13px/1 "SF Mono",Menlo,monospace;color:#cfc9ef;background:rgba(157,140,255,.10);border:1px solid rgba(157,140,255,.22);border-radius:8px;padding:8px 10px;width:max-content}
.call b{color:#4ade80}.call code{font:inherit}.call em{font-style:normal;color:#8d88aa}
.ai{color:#e9e7f5}.ai strong{color:#fff}
.term{position:absolute;left:600px;top:150px;width:650px;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.18);box-shadow:0 40px 80px rgba(0,0,0,.65)}
.term img{display:block;width:100%}
.tbar{display:flex;align-items:center;gap:7px;padding:10px 14px;background:#1c1c1e;border-bottom:1px solid rgba(255,255,255,.08)}
.tbar i{width:11px;height:11px;border-radius:50%}.tbar i:nth-child(1){background:#ff5f57}.tbar i:nth-child(2){background:#febc2e}.tbar i:nth-child(3){background:#28c840}
.tbar span{margin-left:auto;margin-right:auto;transform:translateX(-24px);font:500 12px/1 -apple-system,sans-serif;color:#8e8e93}
</style></head><body>
<img id="bg" src="../hero-background.png">
<div class="shade"></div>
<div class="term"><img src="claude-code.png"></div>
<div class="text">
<div class="tag"><img src="../icon.png">Minecraft MCP</div>
<h1>Let an AI agent <span>run your server</span></h1>
<p>50 tools for Claude, Cursor, and any MCP client, through&nbsp;WorldAPI.</p>
