name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # npm ci also runs prepare, which builds dist/.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Pack the Claude Desktop bundle
        run: npm run pack:mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-mcp
          path: build/*.mcpb
